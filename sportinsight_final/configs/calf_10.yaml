# Version finale avec loss CALF — 10 classes, split officiel SoccerNet
#
# Loss contextuelle asymétrique inspirée de CALF (Cioppa et al. 2020) :
#   - Frames APRÈS  l'action  (dist ≥ -2s, fini) → poids k_after  (1.0, pleine pénalité)
#   - Frames AVANT  proche    (dist ∈ -20s..-2s) → poids 0.0      (zone ambiguë, silence)
#     receptive field ≈ 40 frames = 20s à 2fps — le modèle "voit" déjà l'action
#   - Frames LOIN AVANT       (dist < -20s)      → poids k_before (0.5, contexte réduit)
#   - Frames sans événement   (dist = +inf)      → poids k_bg     (1.0, arrière-plan standard)

data:
  root: "data/SoccerNet"
  train_split_file: "splits/train.txt"
  val_split_file: "splits/valid.txt"
  test_split_file: "splits/test.txt"
  classes:
    - "Goal"
    - "Corner"
    - "Yellow card"
    - "Red card"
    - "Penalty"
    - "Substitution"
    - "Offside"
    - "Foul"
    - "Shots on target"
    - "Shots off target"
  feature_fps: 2.0
  window_size_sec: 120.0
  stride_sec: 60.0
  positive_radius_sec: 2.0
  ignore_radius_sec: 5.0
  imbalance_strategy: "class_stratified"
  cache_features: false

model:
  input_dim: 512
  hidden_dim: 128
  use_projection: true
  num_layers: 3
  dropout: 0.30
  backbone: "unet"
  max_offset_sec: 5.0
  use_attention_bottleneck: true   # MHSA au bottleneck → contexte global sur 120s
  temporal_neck: "gru"             # BiGRU après le décodeur → modélisation séquentielle

loss:
  type: "calf"
  margin_before_sec: 20.0    # borne extérieure de la zone ambiguë ≈ receptive field U-Net (40 frames = 20s à 2fps)
  positive_radius_sec: 2.0   # borne intérieure (= positive_radius_sec du dataset)
  k_before: 0.5              # poids pour les frames loin avant un événement (> 20s)
  k_after: 1.0               # poids pour les frames dans la zone positive et après
  k_bg: 1.0                  # poids pour les frames sans événement à proximité
  lambda_cls: 1.0
  lambda_reg: 0.5
  focal_gamma: 1.2                                          # litterature : gamma=1.2 (lRomul 2023 winner, AI4Sports 2024)
  # Poids 1/sqrt(N) calcules sur le split train reel (300 matchs, normalises Foul=1.0)
  # Counts train : Goal=995 Corner=2884 Ycard=1238 Rcard=34 Penalty=96 Sub=1700 Offside=1265 Foul=7084 SoT=3463 SoffT=3214
  # Ordre        : Goal  Corner  Ycard  Rcard  Penalty  Sub  Offside  Foul  SoT  SoffT
  class_weights: [2.7,   1.6,   2.4,   14.4,  8.6,     2.0,   2.4,  1.0,  1.4,  1.5]

train:
  epochs: 50
  batch_size: 16
  num_workers: 0
  lr: 0.0003
  warmup_epochs: 3           # LinearLR 0→lr sur 3 epochs, puis CosineAnnealingLR (lRomul 2023)
  weight_decay: 0.01         # AdamW litterature : 0.01-0.05 (vs 0.0001 trop faible)
  grad_clip_norm: 1.0
  seed: 42
  device: "auto"
  output_dir: "runs/calf_10"
  validate_every: 1
  map_every: 5
  plot_every: 1

postprocess:
  score_threshold: 0.15      # 0.30 trop conservateur, beaucoup de vrais events entre 0.10-0.30
  nms_radius_sec: 6.0
  max_predictions_per_class: 200
  use_soft_nms: false

metrics:
  tolerances_sec: [5.0, 10.0, 15.0, 20.0, 25.0, 30.0, 35.0, 40.0, 45.0, 50.0, 55.0, 60.0]
