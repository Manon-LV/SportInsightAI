[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "sportinsight-final"
version = "0.1.0"
description = "SportInsight Final — Dense anchor spotter with official SoccerNet split"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.23",
    "pandas>=1.5",
    "PyYAML>=6.0",
    "tqdm>=4.65",
    "torch>=2.0",
    "fastapi>=0.110",
    "uvicorn>=0.27",
    "pydantic>=2.0",
]

[tool.setuptools.packages.find]
where = ["src"]
